    const urlAviso = DEMO ? 'https://script.google.com/macros/s/TU_SERVIDOR/exec?accion=aviso&k=TU_CLAVE' : URL_API + '?accion=aviso&k=' + encodeURIComponent(K);
    const horas = [360, 390, 420, 450, 480, 510, 540];
    abrirHoja(`<span class="eti">Ajustes</span><h3>Melon</h3>
      <h4>Garmin</h4>
      <p>${g.conectado ? (g.ok === false ? 'Conectado, pero da error: ' + esc(g.error) : '<b>Conectado.</b> Se actualiza solo cada hora.') : 'Pega aquí tu clave de la <b>API personal de Garmin</b> (la misma que en Tangerine). Se traen los últimos 90 días.'}</p>
      ${g.conectado ? '<div class="fila1"><button class="btn sec" data-act="actualizar" style="flex:1">Actualizar ahora</button><button class="btn sec" data-act="desconectar" style="flex:1">Desconectar</button></div>'
        : '<input class="campo" id="claveGarmin" placeholder="Clave de Garmin" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" data-act="conectar">Conectar Garmin</button>'}

      <h4>Tus otras apps</h4>

        return `<div class="linea-mas"><span><b>${nombre}</b>${a.conectada ? (a.ok === false ? 'Error: ' + esc(a.error) : 'Conectada · ' + que) : que}</span>

      }).join('')}
      <div id="pegarApp" hidden><input class="campo" id="enlaceApp" placeholder="https://hidegalaxy.github.io/…/?api=…&k=…" autocapitalize="off"><button class="btn" data-act="guardarApp" style="margin-top:8px;width:100%">Conectar</button></div>

      <div class="linea-mas"><span><b>Sueño que quieres</b>Para la meta y la hora de acostarte</span>
        <select id="meta">${horas.map(m => `<option value="${m}" ${aj.meta === m ? 'selected' : ''}>${M.hm(m)}</option>`).join('')}</select></div>
      ${[1, 2, 3, 4, 5, 6, 0].map(i => `<div class="linea-mas"><span>Te levantas el <b style="display:inline">${M.DIAS[i]}</b></span><input type="time" data-despertar="${i}" value="${aj.despertar[i]}"></div>`).join('')}
      <span class="eti">Días de uni</span>
      <div class="dias7">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button data-uni="${i}" aria-pressed="${aj.uni.indexOf(i) >= 0}">${'DLMXJVS'[i]}</button>`).join('')}</div>

      <h4>Avisos al móvil</h4>
      <div class="linea-mas"><span><b>Avisos</b>Por la mañana, picos de estrés y hora de dormir</span>
        <button class="btn ${aj.avisos ? '' : 'sec'}" data-act="avisos">${aj.avisos ? 'Sí' : 'No'}</button></div>
      <ol>
        <li>En <b>Dreceres</b>, crea una drecera nueva llamada <b>Melon avís</b>.</li>
        <li>Afegeix <b>Obtén el contingut de l'URL</b> amb aquesta adreça:<div class="codigo">${esc(urlAviso)}</div><button class="enlace" data-copiar="${esc(urlAviso)}">Copiar la dirección</button></li>
        <li>Afegeix <b>Si</b> → «Contingut de l'URL» <b>té qualsevol valor</b> → <b>Mostra la notificació</b> amb el contingut.</li>
        <li>A <b>Automatització</b>, crea quatre automatitzacions d'<b>Hora del dia</b> (9:00, 13:00, 17:00 i 21:00), cada dia, <b>Executa immediatament</b>, que executin <b>Melon avís</b>.</li>
      </ol>
      <p>A las 9:00 te dice cómo estás (o si ves venir un resfriado); a las 13:00 y 17:00, solo si tu estrés se ha disparado; a las 21:00, a qué hora acostarte. El domingo por la noche, tu semana.</p>

      <h4>Widget del iPhone</h4>

        <li>Instala <b>Scriptable</b> (gratis) desde la App Store.</li>
        <li>Pulsa <b>Copiar el widget</b>, abre Scriptable, crea un script nuevo llamado <b>Melon</b> y pega.</li>
        <li>Añade un widget de Scriptable a la pantalla de inicio o de bloqueo y elige el script <b>Melon</b>.</li>
      </ol>
      <button class="btn sec" data-act="copiarWidget">Copiar el widget</button>`, v => {
      v.querySelector('#meta').onchange = e => enviar('ajustes', { meta: Number(e.target.value) });
      v.querySelectorAll('[data-despertar]').forEach(inp => inp.onchange = () => {
        const desp = D.ajustes.despertar.slice();
        desp[Number(inp.dataset.despertar)] = inp.value;
        if (/^\d\d:\d\d$/.test(inp.value)) enviar('ajustes', { despertar: desp });
      });
    });
  }

  // ---------- Respirar: caja de 4 segundos, 8 vueltas ----------

  function respirar() {
    const r = document.createElement('div');
    r.className = 'respiracion';
    r.innerHTML = '<div class="circulo"></div><div><h2>Inspira</h2><p>Vuelta 1 de 8</p></div><button class="btn sec">Terminar</button>';
    $('app').appendChild(r);
    const c = r.querySelector('.circulo'), t = r.querySelector('h2'), p = r.querySelector('p');
    const pasos = [['Inspira', 1], ['Mantén', 1], ['Suelta', .55], ['Mantén', .55]];
    let k = 0, vuelta = 1;
    let wake = null;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) {}
    const fin = () => { clearInterval(reloj); r.remove(); try { wake && wake.release(); } catch (e) {} };
    const paso = () => {
      const [txt, escala] = pasos[k % 4];
      t.textContent = txt; c.style.transform = 'scale(' + escala + ')';
      p.textContent = 'Vuelta ' + vuelta + ' de 8';
      k++; if (k % 4 === 0) vuelta++;
      if (vuelta > 8) { fin(); avisar('Hecho: 2 minutos'); }
    };
    requestAnimationFrame(paso);
    const reloj = setInterval(paso, 4000);
    r.querySelector('button').onclick = fin;
  }

  function avisar(t) {
    $('toast').textContent = t;
    $('toast').classList.add('ver');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => $('toast').classList.remove('ver'), 3000);
  }
  async function copiar(texto, que) {
    try { await navigator.clipboard.writeText(texto); avisar(que + ' copiado'); }
    catch (e) { avisar('No se ha podido copiar: mantén pulsado para seleccionarlo'); }
  }

  // ---------- Toques ----------

  document.addEventListener('click', async e => {
    const t = e.target.closest('button, [data-hoja]');
    if (!t) return;
    const ds = t.dataset;
    if (ds.tab) return ir(ds.tab);
    if (ds.hoja) return hojaPilar(ds.hoja);
    if (ds.rango) { rango = Number(ds.rango); try { localStorage.setItem('melon.rango', rango); } catch (err) {} return pintar(); }
    if (ds.campo) { campoMind = ds.campo; return pintar(); }
    if (ds.animo) { borrador.animo = Number(ds.animo); return pintarAnimo(); }
    if (ds.energia) { borrador.energia = borrador.energia === Number(ds.energia) ? null : Number(ds.energia); return pintarAnimo(); }
    if (ds.etiqueta) {
      const i = borrador.etiquetas.indexOf(ds.etiqueta);
      i < 0 ? borrador.etiquetas.push(ds.etiqueta) : borrador.etiquetas.splice(i, 1);
      return t.setAttribute('aria-pressed', i < 0);
    }
    if (ds.momento) { momento.animo = Number(ds.momento); return pintarMomento(M.momentoEstres(D.intra, ahoraMin())); }
    if (ds.momEti) {
      const i = momento.etiquetas.indexOf(ds.momEti);
      i < 0 ? momento.etiquetas.push(ds.momEti) : momento.etiquetas.splice(i, 1);
      return t.setAttribute('aria-pressed', i < 0);
    }
    if (ds.uni) {
      const i = Number(ds.uni), uni = D.ajustes.uni.slice();
      const j = uni.indexOf(i);
      j < 0 ? uni.push(i) : uni.splice(j, 1);
      enviar('ajustes', { uni });
      return t.setAttribute('aria-pressed', j < 0);
    }
    if (ds.copiar) return copiar(ds.copiar, 'Enlace');
    if (ds.conectar) { hojaMas.app = ds.conectar; $('pegarApp').hidden = false; $('enlaceApp').focus(); return; }
    if (ds.quitar) return accionDirecta('conexion', { app: ds.quitar, enlace: '' }, 'Quitada');
    switch (ds.act) {
      case 'cerrar': return cerrarHoja();
      case 'mas': return hojaMas();
      case 'respirar': cerrarHoja(); return respirar();
      case 'recargar': return cargar();
      case 'informe': return hojaInforme();
      case 'cambiarAnimo': {
        const r = M.delDia(D.animos)[D.hoy];
        borrador = { animo: r.animo, energia: r.energia, etiquetas: (r.etiquetas || []).slice(), linea: r.linea || '', gratitud: r.gratitud || '' };
        return pintarAnimo();
      }
      case 'guardarAnimo': {
        if (!borrador || !borrador.animo) return;
        const ya = M.delDia(D.animos)[D.hoy];
        enviar('animo', Object.assign({ id: ya ? ya.id : nid('a'), dia: D.hoy, tipo: 'dia', cuando: new Date().toISOString() }, borrador));
        borrador = null;
        return avisar('Guardado');
      }
      case 'guardarMomento': {
        if (!momento || !momento.animo) return;
        enviar('animo', { id: nid('m'), dia: D.hoy, tipo: 'momento', cuando: new Date().toISOString(), animo: momento.animo, etiquetas: momento.etiquetas, linea: '', gratitud: '' });
        momento = null;
        return avisar('Apuntado');
      }
      case 'avisos': enviar('ajustes', { avisos: !D.ajustes.avisos }); return hojaMas();
      case 'conectar': return accionDirecta('garmin', { garmin: $('claveGarmin').value.trim() }, 'Conectando… puede tardar un minuto');
      case 'desconectar': return accionDirecta('garmin', { garmin: '' });
      case 'actualizar': return accionDirecta('actualizar', {}, 'Mirando Garmin…');
      case 'guardarApp': return accionDirecta('conexion', { app: hojaMas.app, enlace: $('enlaceApp').value.trim() }, 'Conectando…');
      case 'copiarInforme': return copiar($('informe').value, 'Informe');
      case 'compartirInforme': try { await navigator.share({ text: $('informe').value }); } catch (err) {} return;
      case 'copiarWidget':
        if (DEMO) return avisar('Primero instala tu servidor');
        try { copiar(await llamar('scriptable'), 'Widget'); } catch (err) { avisar('Error: ' + err.message); }
        return;
    }
  });

  // Lo que no puede esperar en la cola (conectar cosas): se hace ya y se espera la respuesta.
  async function accionDirecta(que, d, mientras) {
    if (DEMO) return avisar('En la demo no se conecta nada');
    if (mientras) avisar(mientras);
    cargando(true);
    try {
      const r = await llamar(que, d);
      D = r.datos; guardarCache();
      avisar(r.msg || 'Hecho');
      const habia = !!$('velo');
      pintar();
      if (habia && que !== 'actualizar') hojaMas();
    } catch (e) {
      avisar(e.red ? 'Sin conexión' : e.message);
    }
    cargando(false);
  }

  // ---------- Datos de ejemplo (sin servidor) ----------

  function demo() {
    const hoy = hoyLocal();
    let semilla = 7;
    const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
    const dias = [], animos = [];
    const lineas = ['Primera vez que llego a 2 dominadas seguidas.', 'Mucho lío en el trabajo y luego uni hasta tarde.', 'Domingo con amigos en la playa.', 'Día tranquilo, estudiando en casa.', 'Me he notado cansado todo el día.'];
    const buenas = ['Café con mi madre', 'Terminé el tema 3 de STE', 'Atardecer volviendo a casa', 'Me salió bien la carrera'];
    for (let i = 90; i >= 0; i--) {
      const d = M.diaMas(hoy, -i), sd = M.semanaDia(d);
      const uni = sd === 2 || sd === 4, finde = sd === 0 || sd === 6;
      const entreno = sd >= 1 && sd <= 5 && azar() > .35;
      const min = Math.round((finde ? 460 : 400) + (azar() - .45) * 130);
      const estres = Math.round(22 + (uni ? 9 : 0) + (450 - min) / 12 + azar() * 10);
      const hrv = Math.round(60 + (min - 420) / 15 - (estres - 30) * .25 + (azar() - .5) * 8);
      const reposo = Math.round(50 + (420 - min) / 75 + (azar() - .5) * 2.5);
      const pasos = Math.round(5200 + azar() * 6800 + (entreno ? 1500 : 0));
      const ini = M.aHora((finde ? 24 * 60 + 30 : 23 * 60 + 10) + (azar() - .5) * 70);
      const x = {
        dia: d,
        sueno: { min, pts: Math.round(40 + min / 10 + (azar() - .5) * 10), prof: Math.round(min * (.13 + azar() * .06)), rem: Math.round(min * (.2 + azar() * .05)), desp: Math.round(8 + azar() * 20), ini, fin: M.aHora(M.aMin(ini) + min + 15), spo2: Math.round(95 + azar() * 3), spo2min: 86, resp: Math.round(13 + azar() * 2), fc: reposo + 5 },
        hrv: { n: hrv, sem: 58, est: 'BALANCED', bajo: 52, alto: 70 },
        reposo, pasos, metaPasos: 10000, intensos: entreno ? 30 + Math.round(azar() * 30) : Math.round(azar() * 10),
        estres: { media: estres, max: 70 + Math.round(azar() * 25), alto: Math.round(azar() * 40), medio: Math.round(30 + azar() * 60) },
        bat: { max: Math.round(55 + (min - 380) / 4 + azar() * 10), min: 15 + Math.round(azar() * 15), carga: Math.round(40 + (min - 380) / 4), gasto: 50 + Math.round(azar() * 20) },
        act: entreno ? [{ t: sd === 2 || sd === 4 ? 'run' : 'fuerza', n: sd === 2 || sd === 4 ? 'Carrera suave' : 'Calistenia A', min: 45, h: '06:20', carga: 60 }] : [],
        ext: { estudio: finde ? 120 + Math.round(azar() * 90) : Math.round(azar() * 150), examen: i >= 0 && i <= 3, agua: 1500 + Math.round(azar() * 1200), creatina: azar() > .2, prot: 100 + Math.round(azar() * 50), gasto: Math.round(azar() * 35) },
      };
      x.sueno.lig = min - x.sueno.prof - x.sueno.rem;
      x.bat.ahora = x.bat.min + 20;
      if (i % 7 === 0) x.kg = Math.round((81.5 + (90 - i) * .01 + (azar() - .5) * .4) * 10) / 10;
      dias.push(x);
      if (i > 0 && azar() > .12) {
        let a = 2.6 + (min - 410) / 85 + (entreno ? 1.1 : 0) - (estres - 30) * .045 + (pasos > 8000 ? .3 : 0) + (azar() - .5) * 1.1;
        a = Math.max(1, Math.min(5, Math.round(a)));
        const et = [];
        if (uni && azar() > .5) et.push('Agobiado con la uni');
        if (finde && azar() > .5) et.push('Con amigos');
        if (a >= 4) et.push(azar() > .5 ? 'Motivado' : 'Tranquilo');
        if (a <= 2) et.push('Cansado');
        animos.push({ id: 'd' + i, cuando: d + 'T21:30:00.000Z', dia: d, tipo: 'dia', animo: a, energia: Math.max(1, Math.min(5, a + (azar() > .5 ? 0 : -1))), etiquetas: et, linea: i < 20 && azar() > .6 ? lineas[i % lineas.length] : '', gratitud: i < 20 && azar() > .6 ? buenas[i % buenas.length] : '' });
      }
    }
    const t = dias[dias.length - 1];
    Object.assign(t, { reposo: 51, hrv: { n: 61, sem: 58, est: 'BALANCED', bajo: 52, alto: 70 }, listo: { p: 78, nivel: 'HIGH' } });
    t.sueno = Object.assign(t.sueno, { min: 372, pts: 71, prof: 62, lig: 196, rem: 98, desp: 16, ini: '23:40', fin: '05:58', necesita: 470 });
    // Batería y estrés de hoy hasta ahora.
    const ahora = ahoraMin(), bateria = [], estres = [];
    const claves = [[0, 30], [360, 82], [390, 80], [450, 73], [540, 72], [840, 63], [930, 66], [1170, 58], [1440, 30]];
    for (let i = 0; i < 96; i++) {
      const m = i * 15;
      let k = 0; while (claves[k + 1] && claves[k + 1][0] <= m) k++;
      const a = claves[k], b2 = claves[Math.min(k + 1, claves.length - 1)];
      bateria.push(m <= ahora ? Math.round(a[1] + (b2[1] - a[1]) * (b2[0] === a[0] ? 0 : (m - a[0]) / (b2[0] - a[0]))) : null);
      const base = m < 360 ? 12 : m < 540 ? 30 : m < 840 ? 38 : m < 1020 ? 52 : 30;
      estres.push(m <= ahora ? Math.max(0, Math.round(base + (azar() - .5) * 30 + (m >= 960 && m < 1020 ? 25 : 0))) : null);
    }
    const ahoraBat = bateria.filter(M.num).pop();
    t.bat = { max: 82, min: Math.min.apply(null, bateria.filter(M.num)), ahora: ahoraBat, carga: 52, gasto: 82 - ahoraBat };
    t.estres = { media: 31, max: 74, alto: 25, medio: 70 };
    t.act = ahora > 450 ? [{ t: 'fuerza', n: 'Calistenia A', min: 48, h: '06:20', carga: 64 }] : [];
    return {
      hoy, dias, animos,
      intra: { dia: hoy, paso: 15, estres, bateria, max: 74 },
      forma: { vo2: 42, vo2dia: '2026-06-27', edad: 18 },
      ajustes: M.ajustes({}),
      garmin: { conectado: true, ok: true, cuando: new Date().toISOString() },
      apps: { tangerine: { conectada: true, ok: true }, plum: { conectada: true, ok: true }, cherry: { conectada: true, ok: true }, lima: { conectada: true, ok: true } },
      ext: { tangerine: { hoy: { titulo: 'Calistenia B', hora: '06:15', clase: 'cal', hecho: false }, rodilla: 2 } },
    };
  }

  // ---------- Arranque ----------

  $('btnRespirar').onclick = respirar;
  $('btnMas').onclick = () => D && hojaMas();
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['today', 'mind', 'trends'].indexOf(h) >= 0) ir(h); });
  if (!DEMO) {
    const c = leerCache();
    if (c) { D = c; pintar(); quitarSplash(); }
    if (!K) pantallaClave(); else { cargar(); vaciar(); }
  } else cargar();
</script>
